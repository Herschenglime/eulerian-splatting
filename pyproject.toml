[project]
name = "eulerian-splatting"
version = "0.1.0"
description = "Eulerian Gaussian Splatting (CVPR 2026), EEL5406 group fork updated for Blackwell GPUs"
requires-python = "==3.10.*"
dependencies = [
    # Blackwell (sm_100 / sm_120) needs CUDA 12.8 builds of PyTorch >= 2.7.
    # On Linux these resolve to the cu128 wheels; on macOS to CPU wheels (tests only).
    "torch==2.7.1",
    "torchvision==0.22.1",
    "numpy<2.3",
    "pillow",
    "plyfile",
    "pyyaml",
    "absl-py",
    "tqdm",
    "matplotlib",
    "torchinfo",
    "wandb",
    "slangtorch; sys_platform != 'darwin'",  # no macOS wheels; the rasterizer is GPU-only anyway
    # COLMAP preprocessing (scripts/run_colmap.py). pycolmap-cuda12 only has Linux x86_64 wheels.
    "pycolmap-cuda12>=4.2.1; sys_platform == 'linux'",
    "pillow-heif",              # iPhone HEIC photos -> JPEG (COLMAP can't read HEIC)
    "opencv-python-headless",   # video frame extraction + sharpness scoring
    # torch's cpp_extension (slangtorch, the sampling kernel, tiny-cuda-nn) builds with ninja.
    # nvcc itself has no complete pip wheel; scripts/setup_cuda_home.sh puts one in .venv/cuda.
    "ninja",
    "setuptools<81",   # tiny-cuda-nn's setup.py imports pkg_resources, removed in setuptools 81
]

# The CUDA submodules (slang-gaussian-rasterization, tiny-cuda-nn) are built from
# source against the installed torch and are NOT part of the lockfile. On a GPU box:
#   uv sync
#   uv pip install --no-build-isolation ./submodules/slang-gaussian-rasterization
#   TCNN_HALF_PRECISION=0 uv pip install --no-build-isolation ./submodules/tiny-cuda-nn/bindings/torch

[dependency-groups]
dev = ["pytest", "pyflakes"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
